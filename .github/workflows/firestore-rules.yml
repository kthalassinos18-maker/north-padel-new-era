# Publishes firestore.rules to Firebase automatically whenever it changes on main
# (no more copy-paste in the Firebase console).
#
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT = the full JSON of a
# Firebase service-account key (Firebase console → Project settings →
# Service accounts → Generate new private key).
name: Publish Firestore rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/firestore-rules.yml]
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service-account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is missing."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          # Sanity check without printing anything secret.
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::Secret is not valid JSON (" + e.message + "). Paste the whole downloaded .json file."); process.exit(1); }
            console.log("type:", j.type, "| project_id:", j.project_id,
              "| client_email is service account:", /iam\.gserviceaccount\.com$/.test(j.client_email || ""),
              "| has private_key:", !!j.private_key);
            if (j.type !== "service_account" || !j.private_key) { console.log("::error::Secret is not a service-account key."); process.exit(1); }
          ' "$RUNNER_TEMP/sa.json"

      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project north-padel-18763 --non-interactive

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
